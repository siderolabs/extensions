name: virtqemud
runnerMode: host
depends:
  - service: cri
  - service: ext-virtlogd
  - service: ext-virtlockd
  - path: /etc/passwd
  - path: /etc/group
container:
  # Talos doesn't run systemd-machined; probing it over D-Bus blocks QEMU reconnect.
  environment:
    - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/libvirt/no-dbus
  entrypoint: /usr/local/sbin/virtqemud
  args:
    - --timeout
    - "0"
restart: always
preShutdown:
  entrypoint: /usr/local/libexec/libvirt-guests-shutdown
  timeout: 5m10s
