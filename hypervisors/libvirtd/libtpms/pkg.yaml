name: libtpms
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: https://github.com/stefanberger/libtpms/archive/refs/tags/{{ .LIBTPMS_VERSION }}.tar.gz
        destination: libtpms.tar.gz
        sha256: "{{ .LIBTPMS_SHA256 }}"
        sha512: "{{ .LIBTPMS_SHA512 }}"
    prepare:
      - |
        tar -xzf libtpms.tar.gz --strip-components=1
        NOCONFIGURE=1 ./autogen.sh

        ./configure \
          --prefix=/usr/local \
          --libdir=/usr/local/lib \
          --disable-static \
          --with-openssl
    build:
      - |
        make -j $(nproc)
    install:
      - |
        make install DESTDIR=/rootfs
        rm -rf /rootfs/usr/local/share
    sbom:
      outputPath: /rootfs/usr/local/share/spdx/libtpms.spdx.json
      version: {{ .LIBTPMS_VERSION | trimPrefix "v" }}
      cpes:
        - cpe:2.3:a:libtpms_project:libtpms:{{ .LIBTPMS_VERSION | trimPrefix "v" }}:*:*:*:*:*:*:*
      licenses:
        - BSD-3-Clause
      customLicenses:
        # TPM 2 license and notices from LICENSE at upstream tag v0.10.2.
        - id: LicenseRef-TCGL
          text: |+
            Licenses and Notices

              1. Copyright Licenses:

              - Trusted Computing Group (TCG) grants to the user of the source code in
