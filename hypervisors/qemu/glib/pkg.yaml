name: glib
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: https://download.gnome.org/sources/glib/{{ regexReplaceAll ".\\d+$" .GLIB_VERSION "${1}" }}/glib-{{ .GLIB_VERSION }}.tar.xz
        destination: glib.tar.xz
        sha256: "{{ .GLIB_SHA256 }}"
        sha512: "{{ .GLIB_SHA512 }}"
    prepare:
      - |
        tar -xf glib.tar.xz --strip-components=1
    build:
      - |
        meson setup \
          --prefix=/usr/local \
          -Ddefault_library=both \
          -Dlibelf=disabled \
          -Dselinux=disabled \
          _build

        ninja -C _build
    install:
      - |
        DESTDIR=/rootfs ninja -C _build install
finalize:
  - from: /rootfs
    to: /
