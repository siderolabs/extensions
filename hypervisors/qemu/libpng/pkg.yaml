name: libpng
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: https://github.com/pnggroup/libpng/archive/refs/tags/v{{ .LIBPNG_VERSION }}.tar.gz
        destination: libpng.tar.gz
        sha256: "{{ .LIBPNG_SHA256 }}"
        sha512: "{{ .LIBPNG_SHA512 }}"
    prepare:
      - |
        tar -xf libpng.tar.gz --strip-components=1
      - |
        ./configure \
          --prefix=/usr/local \
          --disable-static \
          --disable-tools
    build:
      - |
        make -j $(nproc)
    install:
      - |
        make DESTDIR=/rootfs install

        rm -rf /rootfs/usr/local/{bin,share}
        find /rootfs/usr/local/lib -name '*.la' -delete
finalize:
  - from: /rootfs
    to: /
