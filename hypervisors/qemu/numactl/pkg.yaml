name: numactl
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: https://github.com/numactl/numactl/releases/download/v{{ .NUMACTL_VERSION }}/numactl-{{ .NUMACTL_VERSION }}.tar.gz
        destination: numactl.tar.gz
        sha256: "{{ .NUMACTL_SHA256 }}"
        sha512: "{{ .NUMACTL_SHA512 }}"
    prepare:
      - |
        tar -xf numactl.tar.gz --strip-components=1
      - |
        ./configure --prefix=/usr/local
    build:
      - |
        make -j $(nproc)
    install:
      - |
        make DESTDIR=/rootfs install

        rm -rf /rootfs/usr/local/{bin,share}
finalize:
  - from: /rootfs
    to: /
