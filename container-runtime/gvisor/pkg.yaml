name: gvisor
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: https://github.com/google/gvisor/archive/{{ .GVISOR_REV }}.tar.gz
        destination: gvisor.tar.gz
        sha256: {{ .GVISOR_SHA256 }}
        sha512: {{ .GVISOR_SHA512 }}
      - url: https://github.com/google/gvisor/archive/refs/tags/release-{{ .GVISOR_VERSION }}.tar.gz
        destination: gvisor-release.tar.gz
        sha256: {{ .GVISOR_RELEASE_SHA256 }}
        sha512: {{ .GVISOR_RELEASE_SHA512 }}
    env:
      GOPATH: /tmp/go
    cachePaths:
      - /.cache/go-build
      - /tmp/go/pkg
  - network: default
    prepare:
      - |
        mkdir -p ${GOPATH}/src/github.com/google/gvisor

        tar -xzf gvisor.tar.gz --strip-components=1 -C ${GOPATH}/src/github.com/google/gvisor

        mkdir -p /tmp/gvisor-release

        tar -xzf gvisor-release.tar.gz --strip-components=1 -C /tmp/gvisor-release
      - |
        cd ${GOPATH}/src/github.com/google/gvisor

        # The "go" branch strips the sources of the sidecar binaries that runsc
        # expects in "gvisor-bin/" next to itself, so take them from the release tag.
        cp /tmp/gvisor-release/runsc/cmd/sentry/sentry_main.go ./runsc/cmd/sentry/
        cp /tmp/gvisor-release/runsc/cmd/metricserver/metricserver_main.go ./runsc/cmd/metricserver/
        # runsc/checkpointgofer is a library package in the "go" branch, so keep main in its own directory
        mkdir -p ./runsc/checkpointgofer/main
        cp /tmp/gvisor-release/runsc/checkpointgofer/main.go ./runsc/checkpointgofer/main/
        for pkg in runsc/checkpointgofer/gcs runsc/metricserver; do
          mkdir -p ./${pkg}
          find /tmp/gvisor-release/${pkg} -maxdepth 1 -name '*.go' ! -name '*_test.go' -exec cp {} ./${pkg}/ \;
        done
        mkdir -p ./runsc/prewarmer ./runsc/fdparking
        cp /tmp/gvisor-release/runsc/prewarmer/prewarmer.c ./runsc/prewarmer/
        cp /tmp/gvisor-release/runsc/fdparking/fdparking.c ./runsc/fdparking/

        go mod download
  - network: none
    build:
      - |
        cd ${GOPATH}/src/github.com/google/gvisor

        mkdir -p ./bin/gvisor-bin

        # runsc verifies that all sidecars come from the same release
        LDFLAGS="-X gvisor.dev/gvisor/runsc/version.version=release-{{ .GVISOR_VERSION }}"

        CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o ./bin/runsc ./runsc

        CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o ./bin/containerd-shim-runsc-v1 ./shim

        CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o ./bin/gvisor-bin/gvisor_sentry ./runsc/cmd/sentry

        CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o ./bin/gvisor-bin/runsc-metric-server ./runsc/cmd/metricserver

        CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o ./bin/gvisor-bin/checkpointgofer ./runsc/checkpointgofer/main

        # Freestanding static C binaries, flags match upstream Bazel genrules.
        CFLAGS="-Os -fno-pie -no-pie -ffreestanding -fno-stack-protector -fno-asynchronous-unwind-tables -fno-unwind-tables -static -nostdlib -nostartfiles -Wl,--build-id=none -Wl,--gc-sections -Wl,-s -Wl,-n"

        cc ${CFLAGS} -o ./bin/gvisor-bin/gvisor-sentry-prewarmer ./runsc/prewarmer/prewarmer.c

        cc ${CFLAGS} -o ./bin/gvisor-bin/runsc-fd-parking ./runsc/fdparking/fdparking.c
    install:
      - |
        mkdir -p /rootfs/usr/local/bin

        cd ${GOPATH}/src/github.com/google/gvisor

        cp ./bin/runsc /rootfs/usr/local/bin/runsc
        chmod +x /rootfs/usr/local/bin/runsc

        cp ./bin/containerd-shim-runsc-v1 /rootfs/usr/local/bin/containerd-shim-runsc-v1
        chmod +x /rootfs/usr/local/bin/containerd-shim-runsc-v1

        cp -r ./bin/gvisor-bin /rootfs/usr/local/bin/gvisor-bin
        chmod +x /rootfs/usr/local/bin/gvisor-bin/*

      - |
        mkdir -p /rootfs/etc/cri/conf.d

        cp /pkg/10-gvisor.part /pkg/runsc.toml /pkg/10-gvisor-kvm.part /pkg/runsc-kvm.toml /rootfs/etc/cri/conf.d/
    test:
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
    sbom:
      outputPath: /rootfs/usr/local/share/spdx/gvisor.spdx.json
      version: {{ .GVISOR_VERSION }}
      cpes:
        - cpe:2.3:a:google:gvisor:{{ .GVISOR_VERSION }}:*:*:*:*:*:*:*
      licenses:
        - Apache-2.0
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
