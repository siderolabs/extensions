name: kubelet-credential-provider-vault
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: https://github.com/simonostendorf/kubelet-credential-provider-vault/archive/refs/tags/{{ .KUBELET_CREDENTIAL_PROVIDER_VAULT_VERSION }}.tar.gz
        destination: kubelet-credential-provider-vault.tar.gz
        sha256: {{ .KUBELET_CREDENTIAL_PROVIDER_VAULT_SHA256 }}
        sha512: {{ .KUBELET_CREDENTIAL_PROVIDER_VAULT_SHA512 }}
    env:
      GOPATH: /tmp/go
    cachePaths:
      - /.cache/go-build
      - /tmp/go/pkg
  - network: default
    prepare:
      - |
        mkdir -p ${GOPATH}/src/github.com/simonostendorf/kubelet-credential-provider-vault

        tar -xzf kubelet-credential-provider-vault.tar.gz --strip-components=1 -C ${GOPATH}/src/github.com/simonostendorf/kubelet-credential-provider-vault
      - |
        cd ${GOPATH}/src/github.com/simonostendorf/kubelet-credential-provider-vault
        go mod download
  - network: none
    build:
      - |
        CGO_ENABLED=0 go build \
          -C ${GOPATH}/src/github.com/simonostendorf/kubelet-credential-provider-vault \
          -o ./dist/kubelet-credential-provider-vault \
          -ldflags "-s -w" \
          .
    install:
      - install -D -m 0755
        ${GOPATH}/src/github.com/simonostendorf/kubelet-credential-provider-vault/dist/kubelet-credential-provider-vault
        /rootfs/usr/local/lib/kubelet/credentialproviders/kubelet-credential-provider-vault
    test:
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
    sbom:
      outputPath: /rootfs/usr/local/share/spdx/kubelet-credential-provider-vault.spdx.json
      version: {{ .KUBELET_CREDENTIAL_PROVIDER_VAULT_VERSION }}
      licenses:
        - MIT
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
