name: acr-credential-provider
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: https://github.com/kubernetes-sigs/cloud-provider-azure/archive/refs/tags/{{ .CLOUD_PROVIDER_AZURE_VERSION }}.tar.gz
        destination: cloud-provider-azure.tar.gz
        sha256: {{ .CLOUD_PROVIDER_AZURE_SHA256 }}
        sha512: {{ .CLOUD_PROVIDER_AZURE_SHA512 }}
    env:
      GOPATH: /tmp/go
    cachePaths:
      - /.cache/go-build
      - /tmp/go/pkg
  - network: default
    prepare:
      - |
        mkdir -p ${GOPATH}/src/sigs.k8s.io/cloud-provider-azure

        tar -xzf cloud-provider-azure.tar.gz --strip-components=1 -C ${GOPATH}/src/sigs.k8s.io/cloud-provider-azure
      - |
        cd ${GOPATH}/src/sigs.k8s.io/cloud-provider-azure
        go mod download
  - network: none
    build:
      - |
        CGO_ENABLED=0 go build \
          -C ${GOPATH}/src/sigs.k8s.io/cloud-provider-azure \
          -o ./dist/acr-credential-provider \
          -ldflags "-s -w \
                   -X sigs.k8s.io/cloud-provider-azure/pkg/version.gitVersion={{ .VERSION }} \
                   -X k8s.io/client-go/pkg/version.gitVersion={{ .VERSION }}" \
          ./cmd/acr-credential-provider
    install:
      - install -D -m 0755
        ${GOPATH}/src/sigs.k8s.io/cloud-provider-azure/dist/acr-credential-provider
        /rootfs/usr/local/lib/kubelet/credentialproviders/acr-credential-provider
    test:
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
    sbom:
      outputPath: /rootfs/usr/local/share/spdx/acr-credential-provider.spdx.json
      version: {{ .CLOUD_PROVIDER_AZURE_VERSION }}
      licenses:
        - Apache-2.0
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
