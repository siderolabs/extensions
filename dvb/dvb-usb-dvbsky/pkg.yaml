name: dvb-usb-dvbsky
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  # The pkgs version for a particular release of Talos as defined in
  # https://github.com/siderolabs/talos/blob/<talos version>/pkg/machinery/gendata/data/pkgs
  - image: "{{ .BUILD_ARG_PKGS_PREFIX }}/kernel:{{ .BUILD_ARG_PKGS }}"
steps:
  - prepare:
      - |
        mkdir -p /rootfs
    # {{ if eq .ARCH "x86_64" }} This in fact is YAML comment, but Go templating instruction is evaluated by bldr
      - |
        tar xf dvb-firmware.tar.gz
    sources:
      - url: https://github.com/CoreELEC/dvb-firmware/archive/refs/tags/{{ .COREELEC_DVB_FIRMWARE_VERSION }}.tar.gz
        destination: dvb-firmware.tar.gz
        sha256: {{ .COREELEC_DVB_FIRMWARE_SHA256 }}
        sha512: {{ .COREELEC_DVB_FIRMWARE_SHA512 }}
    install:
      - |
        export KERNELRELEASE=$(find /usr/lib/modules -type d -name "*-talos" -exec basename {} \+)

        xargs -a /pkg/files/modules.txt -I {} install -D /usr/lib/modules/${KERNELRELEASE}/{} /rootfs/usr/lib/modules/${KERNELRELEASE}/{}
        depmod -b /rootfs/usr ${KERNELRELEASE}
      - |
        mkdir -p /rootfs/usr/local/lib/modprobe.d
        cp /pkg/files/dvb.conf /rootfs/usr/local/lib/modprobe.d/dvb-usb-dvbsky.conf
      - |
        mkdir -p /rootfs/usr/lib/firmware
        cp dvb-firmware-{{ .COREELEC_DVB_FIRMWARE_VERSION }}/firmware/dvb-demod-m88ds3103.fw /rootfs/usr/lib/firmware
        cp dvb-firmware-{{ .COREELEC_DVB_FIRMWARE_VERSION }}/firmware/dvb-demod-m88ds3103b.fw /rootfs/usr/lib/firmware
        cp dvb-firmware-{{ .COREELEC_DVB_FIRMWARE_VERSION }}/firmware/dvb-demod-si2168-a20-01.fw /rootfs/usr/lib/firmware
        cp dvb-firmware-{{ .COREELEC_DVB_FIRMWARE_VERSION }}/firmware/dvb-demod-si2168-a30-01.fw /rootfs/usr/lib/firmware
        cp dvb-firmware-{{ .COREELEC_DVB_FIRMWARE_VERSION }}/firmware/dvb-demod-si2168-b40-01.fw /rootfs/usr/lib/firmware
        cp dvb-firmware-{{ .COREELEC_DVB_FIRMWARE_VERSION }}/firmware/dvb-demod-si2168-d60-01.fw /rootfs/usr/lib/firmware
        cp dvb-firmware-{{ .COREELEC_DVB_FIRMWARE_VERSION }}/firmware/dvb-tuner-si2141-a10-01.fw /rootfs/usr/lib/firmware
        cp dvb-firmware-{{ .COREELEC_DVB_FIRMWARE_VERSION }}/firmware/dvb-tuner-si2157-a30-01.fw /rootfs/usr/lib/firmware
        cp dvb-firmware-{{ .COREELEC_DVB_FIRMWARE_VERSION }}/firmware/dvb-tuner-si2158-a20-01.fw /rootfs/usr/lib/firmware
    test:
      - |
        # https://www.kernel.org/doc/html/v4.15/admin-guide/module-signing.html#signed-modules-and-stripping
        find /rootfs/usr/lib/modules -name '*.ko' -exec grep -FL '~Module signature appended~' {} \+
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
    # {{ end }} This in fact is YAML comment, but Go templating instruction is evaluated by bldr
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
