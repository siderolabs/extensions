name: nvidia-fabricmanager-gcc-runtime
variant: scratch
dependencies:
  - image: cgr.dev/chainguard/wolfi-base@{{ .WOLFI_BASE_REF }}
  - image: "{{ .BUILD_ARG_PKGS_PREFIX }}/gcc-runtime:{{ .BUILD_ARG_PKGS }}"
    from: /usr/lib/libgcc_s.so.1
    to: /rootfs/usr/local/lib/containers/nvidia-fabricmanager/opt/nvidia/nvlsm/lib/libgcc_s.so.1
steps:
  - install:
      - |
        mkdir -p /rootfs/usr/local/lib/containers/nvidia-fabricmanager/opt/nvidia/nvlsm/lib

        # {{ if eq .ARCH "aarch64" }} This in fact is YAML comment, but Go templating instruction is evaluated by bldr
        ln -s usr/lib /rootfs/usr/local/lib/containers/nvidia-fabricmanager/lib
        # {{ else }} This in fact is YAML comment, but Go templating instruction is evaluated by bldr
        ln -s usr/lib /rootfs/usr/local/lib/containers/nvidia-fabricmanager/lib64
        # {{ end }} This in fact is YAML comment, but Go templating instruction is evaluated by bldr
finalize:
  - from: /rootfs
    to: /rootfs
