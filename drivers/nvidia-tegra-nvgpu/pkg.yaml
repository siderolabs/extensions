name: nvidia-tegra-nvgpu
variant: scratch
shell: /bin/bash
# {{ if eq .ARCH "aarch64" }} This in fact is YAML comment, but Go templating instruction is evaluated by bldr
dependencies:
  - stage: base
  # The pkgs version for a particular release of Talos as defined in
  # https://github.com/siderolabs/talos/blob/<talos version>/pkg/machinery/gendata/data/pkgs
  - image: "{{ .BUILD_ARG_PKGS_PREFIX }}/nvidia-tegra-nvgpu-pkg:{{ .BUILD_ARG_PKGS }}"
steps:
  - install:
      - |
        mkdir -p /rootfs/usr/lib/modules \
          /rootfs/usr/lib/firmware/nvidia \
          /rootfs/usr/local/lib/modprobe.d

        cp -R /usr/lib/modules/* /rootfs/usr/lib/modules/
        cp -R -p /usr/lib/firmware/nvidia/ga10b /rootfs/usr/lib/firmware/nvidia/
        cp /usr/lib/modprobe.d/nvidia-tegra.conf /rootfs/usr/local/lib/modprobe.d/nvidia-tegra.conf
    test:
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
# {{ else }} This in fact is YAML comment, but Go templating instruction is evaluated by bldr
dependencies:
  - stage: base
steps:
  - prepare:
      - |
        mkdir /rootfs
finalize:
  - from: /pkg/manifest.yaml
    to: /manifest.yaml
  - from: /rootfs
    to: /rootfs
# {{ end }} This in fact is YAML comment, but Go templating instruction is evaluated by bldr
