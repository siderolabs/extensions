name: msr
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  # Use the same signed kernel modules as the target Talos release.
  - image: "{{ .BUILD_ARG_PKGS_PREFIX }}/kernel:{{ .BUILD_ARG_PKGS }}"
steps:
  - prepare:
      - |
        mkdir -p /rootfs
  # {{ if eq .ARCH "x86_64" }} Evaluated by bldr before parsing YAML.
  - install:
      - |
        KERNELRELEASE=$(find /usr/lib/modules -type d -name "*-talos" -exec basename {} \+)
        test -n "${KERNELRELEASE}"

        if ! test -f "/usr/lib/modules/${KERNELRELEASE}/kernel/arch/x86/kernel/msr.ko"; then
          echo 'msr requires a matching Talos kernel package built with CONFIG_X86_MSR=m' >&2
          exit 1
        fi

        xargs -a /pkg/files/modules.txt -I {} install -D "/usr/lib/modules/${KERNELRELEASE}/{}" "/rootfs/usr/lib/modules/${KERNELRELEASE}/{}"
        depmod -b /rootfs/usr "${KERNELRELEASE}"
  - test:
      - |
        module=$(find /rootfs/usr/lib/modules -type f -name msr.ko)
        test -n "${module}"
        grep -Fq '~Module signature appended~' "${module}"
        test "$(find /rootfs/usr/lib/modules -type f -name '*.ko' | wc -l)" -eq 1
  # {{ end }} Evaluated by bldr before parsing YAML.
  - test:
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
