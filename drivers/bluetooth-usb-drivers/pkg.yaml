name: bluetooth-usb-drivers
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  # The pkgs version for a particular release of Talos as defined in
  # https://github.com/siderolabs/talos/blob/<talos version>/pkg/machinery/gendata/data/pkgs
  - image: "{{ .BUILD_ARG_PKGS_PREFIX }}/kernel:{{ .BUILD_ARG_PKGS }}"
steps:
  - install:
      - |
        KERNELRELEASE=$(find /usr/lib/modules -type d -name "*-talos" -exec basename {} \+)
        test -n "${KERNELRELEASE}"

        mkdir -p /rootfs

        xargs -a /pkg/files/modules-{{ .ARCH }}.txt -I {} install -D "/usr/lib/modules/${KERNELRELEASE}/{}" "/rootfs/usr/lib/modules/${KERNELRELEASE}/{}"
        depmod -b /rootfs/usr "${KERNELRELEASE}"
  - test:
      - |
        module_count=0

        while IFS= read -r module; do
          module_count=$((module_count + 1))

          if ! grep -Fq '~Module signature appended~' "${module}"; then
            echo "unsigned kernel module: ${module}" >&2
            exit 1
          fi
        done < <(find /rootfs/usr/lib/modules -type f -name '*.ko' -print)

        test "${module_count}" -gt 0
      - |
        test ! -e /rootfs/usr/lib/firmware
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
