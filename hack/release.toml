xdma-driver: a918c51
"""

    [notes.nvidia-new-feature]
        title = "NVIDIA New Feature Branch"
        description = """\
New `nvidia-open-gpu-kernel-modules-new-feature`, `nvidia-container-toolkit-new-feature` and `nvidia-fabricmanager-new-feature`
extensions track the NVIDIA "new feature" driver branch (615.x), in addition to the existing `lts` and `production` variants.
Only the open-source kernel modules are provided for this branch, as NVIDIA does not ship a proprietary build of 615.x.
"""

    [notes.nvidia-LTS]
        title = "NVIDIA LTS Branch"
        description = """\
NVIDIA LTS was updated to 620.x, which removes nonfree build of the NVIDIA drivers.
Image Factory on upgrade from previous versions of Talos will replace the nonfree-LTS extension with open-source-LTS extension, which is the only supported variant of the LTS branch.
Starting with driver 620, NVIDIA Fabric Manager has a standalone version (2.0.x), so `nvidia-fabricmanager-lts` now bundles
Fabric Manager 2.0.0.rel106 together with the `libnvidia-fmdrv` library from the 620.70.06 driver, as described in the
[Fabric Manager User Guide](https://docs.nvidia.com/datacenter/tesla/fabric-manager-user-guide/index.html).
"""

[make_deps]

    [make_deps.tools]
        variable = "TOOLS"
        repository = "github.com/siderolabs/tools"

    [make_deps.pkgs]
        variable = "PKGS"
        repository = "github.com/siderolabs/pkgs"
