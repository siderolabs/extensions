# commit to be tagged for new release
commit = "HEAD"

project_name = "Talos System Extensions"
github_repo = "siderolabs/extensions"
match_deps = "^github.com/((talos-systems|siderolabs)/[a-zA-Z0-9-]+)$"

# previous release
previous = "v1.14.0"

pre_release = true

preface = """\
See [Talos Linux documentation](https://docs.siderolabs.com/talos/v1.14/build-and-extend-talos/custom-images-and-development/system-extensions) for information on using system extensions.
"""

[notes]

    [notes.updates]
        title = "Component Updates"
        description = """\
ceph: 21.3.0
cloud-provider-aws: v1.37.0
cloudflared: 2026.8.3
crun: 1.29.1
ctr: 2.3.5
fuse: 3.18.3
glib: 2.90.0
gvisor: 20260831.0
hyperv-guest-agent: 6.18.50
kata-containers: 4.1.0
libvirt: 12.7.0
libxml2: 2.15.4
nebula: 1.11.1
netbird: 0.78.1
newt: 1.16.0
Open-iSCSI: 2.1.13
qemu-guest-agent: 11.1.1
tailscale: 1.102.3
"""

[make_deps]

    [make_deps.tools]
        variable = "TOOLS"
        repository = "github.com/siderolabs/tools"

    [make_deps.pkgs]
        variable = "PKGS"
        repository = "github.com/siderolabs/pkgs"
