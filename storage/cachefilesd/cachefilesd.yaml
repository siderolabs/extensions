name: cachefilesd
depends:
  - path: /dev/cachefiles
container:
  entrypoint: /usr/local/sbin/cachefilesd
  args:
    - -s
    - -n
    - -f
    - /usr/local/etc/cachefilesd.conf
  mounts:
    # musl dynamic linker
    - source: /lib
      destination: /lib
      type: bind
      options:
        - bind
        - ro
    # libc
    - source: /usr/lib
      destination: /usr/lib
      type: bind
      options:
        - bind
        - ro
    # cachefilesd binary
    - source: /usr/local/sbin
      destination: /usr/local/sbin
      type: bind
      options:
        - bind
        - ro
    # config file
    - source: /usr/local/etc/cachefilesd.conf
      destination: /usr/local/etc/cachefilesd.conf
      type: bind
      options:
        - bind
        - ro
    # cache root, rw: the cachefiles kernel module sets xattrs on it
    - source: /var/cache/fscache
      destination: /var/cache/fscache
      type: bind
      options:
        - rshared
        - rbind
        - rw
    # cachefilesd requires these subdirs to pre-exist; Talos creates mount
    # sources on the host before start. rw: a mount shadows the parent beneath it
    - source: /var/cache/fscache/cache
      destination: /var/cache/fscache/cache
      type: bind
      options:
        - rshared
        - rbind
        - rw
    - source: /var/cache/fscache/graveyard
      destination: /var/cache/fscache/graveyard
      type: bind
      options:
        - rshared
        - rbind
        - rw
    # /dev for /dev/cachefiles and /dev/null
    - source: /dev
      destination: /dev
      type: bind
      options:
        - rshared
        - rbind
        - rw
restart: always
